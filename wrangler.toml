name = "sunmoon-v2"
main = "src/worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# First deploy creates this database. Afterwards, add its id on the next line (database_id = "...") so it is pinned and always reused.
[[d1_databases]]
binding = "DB"
database_name = "sunmoon-v2-db"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
