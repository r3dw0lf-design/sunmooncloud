name = "sunmooncloud"
main = "src/worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# No database_id on purpose: wrangler creates the D1 database for you on the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "sunmoon"

# Live chat: one Durable Object per couple (SQLite-backed, which is the kind the free plan allows).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "PairRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairRoom"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
